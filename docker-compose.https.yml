# HTTPS con dominio propio: Caddy obtiene y renueva el certificado solo (Let's Encrypt).
# Se usa SOBRE el compose base:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Requiere DOMINIO en .env, con el registro DNS A apuntando a la IP del VPS y los puertos 80/443 abiertos.
# Necesita Docker Compose >= 2.24 (por `!override`).

services:
  frontend:
    # Ya no se publica a internet: solo Caddy lo alcanza (y localmente, para depurar).
    ports: !override
      - "127.0.0.1:${PUERTO_WEB:-8080}:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_datos:
  caddy_config:
