server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los soportes que se suben (matricula, inclusion, asistencia) llegan hasta 5 MB y las entregas de actividades (M11)
    # hasta 10 MB: el tope cubre el archivo mas el sobrecosto del formulario multipart.
    client_max_body_size 12m;

    # Los PDF de planeación (M07: documentos de apoyo del MEN, plan de área y plan de aula) llegan hasta 25 MB: el DBA de Ciencias
    # Sociales del MEN pesa ~16 MB. Solo esta ruta sube el tope; el resto de la API conserva el de arriba.
    location /api/v1/planeacion/ {
        client_max_body_size 27m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los adjuntos de una actividad (M11) llegan hasta 50 MB por archivo y 5 archivos por subida.
    location = /api/v1/activities/adjuntos {
        client_max_body_size 260m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    # Archivos de Vite con hash en el nombre: se pueden cachear sin limite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (/admin/..., /convivencia/...) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
