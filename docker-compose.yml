# Klassy completo en contenedores (VPS, o local si se quiere probar igual que en el servidor).
# Uso: cp .env.produccion.example .env  ->  editar  ->  docker compose up -d --build
# Guia: DOCKER.md

services:
  mongo:
    image: mongo:7
    # Replica set de un solo nodo: Klassy usa transacciones, que lo exigen.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_datos:/data/db
    # Solo en la interfaz local de la maquina: nunca expuesto a internet.
    ports:
      - "127.0.0.1:${PUERTO_MONGO:-27017}:27017"
    healthcheck:
      # La primera vez inicia el replica set; sano = ya es primario y acepta escrituras.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: produccion
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de Docker la base es siempre el contenedor `mongo`, sin importar lo que diga .env.
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-klassy}?replicaSet=rs0
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: produccion
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-80}:80"
    depends_on:
      - backend

  # Seeds y migraciones: docker compose run --rm herramientas npm run seed
  herramientas:
    build:
      context: ./backend
      target: herramientas
    profiles: ["herramientas"]
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-klassy}?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_datos:
  uploads:
